<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Ludo Universe — a premium, portrait-first social Ludo world.">
  <title>Ludo Universe</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/board.css">
  <link rel="stylesheet" href="css/overlays.css">
</head>
<body>
  <div id="backdrop" aria-hidden="true"></div>
  <main id="stage" data-theme-event="none">
    <div id="screen-host"></div>
    <nav id="nav" class="hidden" aria-label="Main"></nav>
    <div id="overlay-host"></div>
    <div id="toast-host" aria-live="polite"></div>
    <canvas id="fx-canvas" aria-hidden="true"></canvas>
  </main>
  <noscript>Ludo Universe needs JavaScript to play.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
